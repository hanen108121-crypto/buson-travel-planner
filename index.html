<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Busan 遊記｜行程網站</title>
  <style>
    :root{
      --bg:#f6efd9;--paper:#fffaf0;--ink:#4e4435;--muted:#9d8d76;--line:#dfd0b6;--main:#4f4437;--accent:#c79a56;--danger:#b85c5c;--shadow:0 12px 28px rgba(75,59,40,.12);--radius:22px
    }
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg),#efe3c6)}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.phone{width:min(100%,460px);min-height:100vh;margin:auto;background:var(--bg);box-shadow:0 0 0 1px rgba(0,0,0,.04),0 24px 80px rgba(0,0,0,.18);position:relative}.app{padding:28px 20px 105px}.top{display:flex;justify-content:space-between;gap:16px;margin-bottom:18px}.eyebrow{font-family:Georgia,serif;letter-spacing:.14em;color:var(--accent);font-size:12px;font-style:italic}h1{margin:7px 0 0;font-family:Georgia,serif;font-size:31px;font-weight:500;color:var(--main)}.icon-btn{width:44px;height:44px;border-radius:999px;background:rgba(255,255,255,.72);box-shadow:var(--shadow);color:var(--main)}.date-strip{background:rgba(255,248,233,.64);border-radius:28px;padding:13px 8px 18px;box-shadow:0 20px 30px rgba(97,76,49,.08);margin-bottom:22px}.dates{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}.dates::-webkit-scrollbar{display:none}.date-card{min-width:66px;height:86px;border-radius:20px;background:rgba(255,255,255,.72);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 7px 16px rgba(84,66,42,.1)}.date-card.active{background:var(--main);color:#fff6e6}.date-card .weekday{font-family:Georgia,serif;font-size:12px;letter-spacing:.08em;font-style:italic}.date-card .day{font-size:28px;line-height:1;margin:5px 0}.date-card .month{font-size:12px}.mini-line{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--muted);font:italic 12px Georgia,serif}.mini-line:before,.mini-line:after{content:"";height:8px;flex:1;border-top:7px solid var(--main);border-radius:99px;opacity:.65}.quick{width:100%;min-height:48px;border-radius:14px;background:rgba(255,252,243,.7);color:var(--main);border:1.5px dashed #c7a976;display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin-bottom:16px}.section{display:flex;align-items:end;justify-content:space-between;margin:22px 0 12px}.section h2{margin:0;font-size:22px;font-family:Georgia,"Noto Serif TC",serif;font-weight:500}.section span{font:italic 13px Georgia,serif;color:var(--muted)}.card{background:rgba(255,252,245,.85);border:1px solid rgba(223,208,182,.72);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.card-title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700}.view{background:transparent;color:var(--accent);font-size:13px}.timeline{display:grid}.timeline-item{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center;min-height:62px;border-bottom:1px dashed var(--line);padding:10px 0}.timeline-item:last-child{border-bottom:0}.time{color:var(--accent);font:700 14px Georgia,serif}.name{font-weight:700;margin-bottom:3px}.meta{color:var(--muted);font-size:13px;line-height:1.45}.actions{display:flex;gap:6px}.tiny{width:30px;height:30px;border-radius:10px;background:#f2e5c9;color:var(--main)}.tiny.danger{color:var(--danger)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.feature{min-height:116px;background:rgba(255,252,245,.86);border:1px solid rgba(223,208,182,.72);border-radius:22px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:var(--ink)}.feature .ico{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;background:#f0dfbd;font-size:20px}.feature small{color:var(--muted);line-height:1.45}.page{display:none}.page.active{display:block}.form{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:grid;gap:6px;color:var(--muted);font-size:13px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:#fffaf0;color:var(--ink);padding:12px 13px;outline:0}textarea{min-height:80px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(199,154,86,.18)}.primary,.secondary{min-height:46px;border-radius:15px;font-weight:700}.primary{background:var(--main);color:#fff8e8}.secondary{background:#ead9b7;color:var(--main)}.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}.pill{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.55);color:var(--muted);border:1px solid var(--line);font-size:13px}.pill.active{background:var(--main);color:#fff7e8;border-color:var(--main)}.place,.expense,.route{display:grid;gap:8px;border-bottom:1px dashed var(--line);padding:14px 0}.place:last-child,.expense:last-child,.route:last-child{border-bottom:0}.badge{display:inline-flex;width:fit-content;padding:5px 10px;border-radius:999px;background:#f0dfbd;color:var(--main);font-size:12px;font-weight:700}.two{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}.amount{font-family:Georgia,serif;color:var(--accent);font-size:20px;font-weight:700;white-space:nowrap;text-align:right}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.summary-item{background:#f2e5c9;border-radius:18px;padding:14px}.summary-item small{color:var(--muted)}.summary-item strong{display:block;margin-top:4px;font:700 20px Georgia,serif}.mapbox{height:260px;border-radius:22px;background:#efe1c1;overflow:hidden;margin-bottom:14px;border:1px solid rgba(126,101,66,.18)}.mapbox iframe{width:100%;height:100%;border:0;display:block}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,460px);height:86px;background:rgba(255,250,240,.92);border-top:1px solid rgba(223,208,182,.75);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:8px 8px 12px;backdrop-filter:blur(16px);z-index:20}.nav-btn{background:transparent;color:var(--muted);display:grid;place-items:center;gap:4px;font-size:12px}.nav-btn .nav-ico{font-size:24px}.nav-btn.active{color:var(--main);font-weight:700}.home-circle{width:58px;height:58px;border-radius:999px;background:var(--main);color:#fff8e8;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(79,68,55,.12),0 12px 20px rgba(79,68,55,.22);margin-top:-28px;font-size:26px}.empty{color:var(--muted);text-align:center;padding:22px 10px;line-height:1.6}.dialog-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;padding:24px;align-items:center;justify-content:center}.dialog-bg.open{display:flex}.dialog{width:min(100%,420px);max-height:88vh;overflow:auto;background:var(--paper);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.22);padding:20px}.dialog h3{margin:0 0 14px;font-size:21px;font-family:Georgia,"Noto Serif TC",serif}.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.link{background:transparent;color:var(--accent);font-weight:700;text-align:left;padding:0}@media(max-width:380px){.app{padding-inline:14px}.row,.grid,.summary{grid-template-columns:1fr}.timeline-item{grid-template-columns:52px 1fr}.timeline-item .actions{grid-column:2}}
  </style>
</head>
<body>
  <main class="phone">
    <div class="app">
      <header class="top">
        <div><div class="eyebrow" id="tripSubtitle">Buson．釜山之旅</div><h1 id="tripTitle">Busan 遊記</h1></div>
        <button class="icon-btn" onclick="openSettings()">⚙️</button>
      </header>
      <section class="date-strip"><div class="dates" id="dateStrip"></div><div class="mini-line" id="dayText">Day 1 / 1</div></section>

      <section class="page active" id="page-home">
        <button class="quick" onclick="setTab('map')"><span>✈️ 出團資訊・航班時刻表</span><span>›</span></button>
        <article class="card"><div class="card-head"><div class="card-title">🗓 今日行程</div><button class="view" onclick="setTab('schedule')">查看全部 ›</button></div><div class="timeline" id="todayPreview"></div></article>
        <div class="section"><h2>功能總覽</h2><span>Menu</span></div>
        <section class="grid">
          <button class="feature" onclick="setTab('schedule')"><span class="ico">📅</span><strong>行程</strong><small>依日期、時間排列，可新增與編輯每天活動。</small></button>
          <button class="feature" onclick="setTab('map')"><span class="ico">🗺️</span><strong>地圖 / 交通</strong><small>儲存地點與交通路線，一鍵開 Google Maps。</small></button>
          <button class="feature" onclick="setTab('expense')"><span class="ico">💳</span><strong>記帳</strong><small>記錄支出，並自動換算台幣。</small></button>
          <button class="feature" onclick="setTab('places')"><span class="ico">🔖</span><strong>景點 / 美食</strong><small>分類收藏景點、美食、購物與備註。</small></button>
        </section>
      </section>

      <section class="page" id="page-schedule"><div class="section"><h2>行程</h2><span>Schedule</span></div><article class="card"><div class="card-head"><div class="card-title">📅 當日行程</div><button class="view" onclick="openScheduleForm()">＋新增</button></div><div id="scheduleList"></div></article></section>

      <section class="page" id="page-map"><div class="section"><h2>地圖與交通</h2><span>Map</span></div><div class="mapbox"><iframe id="googleMapFrame" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe></div><article class="card"><div class="card-head"><div class="card-title">🚆 交通路線</div><button class="view" onclick="openRouteForm()">＋新增</button></div><div id="routeList"></div></article><article class="card"><div class="card-head"><div class="card-title">📍 地點快速開圖</div><button class="view" onclick="setTab('places')">管理景點 ›</button></div><div id="mapPlaceList"></div></article></section>

      <section class="page" id="page-expense"><div class="section"><h2>記帳</h2><span>Budget</span></div><div class="summary"><div class="summary-item"><small>當日支出</small><strong id="todayTotal">NT$0</strong></div><div class="summary-item"><small>全旅程支出</small><strong id="tripTotal">NT$0</strong></div></div><article class="card"><div class="card-head"><div class="card-title">💳 支出紀錄</div><button class="view" onclick="openExpenseForm()">＋新增</button></div><div id="expenseList"></div></article></section>

      <section class="page" id="page-places">
        <div class="section"><h2>景點與美食</h2><span>Places</span></div>
        <div class="pill-row" id="placeFilters"></div>
        <article class="card"><div class="card-head"><div class="card-title">🔖 收藏清單</div><button class="view" onclick="openPlaceForm()">＋新增</button></div><div id="placeList"></div></article>
        <article class="card"><div class="card-head"><div class="card-title">✅ 代辦清單</div><button class="view" onclick="openTodoForm()">＋新增</button></div><div id="todoList"></div></article>
      </section>
    </div>

    <nav class="nav">
      <button class="nav-btn" data-tab="schedule" onclick="setTab('schedule')"><span class="nav-ico">📅</span><span>行程</span></button>
      <button class="nav-btn" data-tab="map" onclick="setTab('map')"><span class="nav-ico">🗺️</span><span>地圖</span></button>
      <button class="nav-btn active" data-tab="home" onclick="setTab('home')"><span class="home-circle">⌂</span><span>首頁</span></button>
      <button class="nav-btn" data-tab="expense" onclick="setTab('expense')"><span class="nav-ico">💳</span><span>記帳</span></button>
      <button class="nav-btn" data-tab="places" onclick="setTab('places')"><span class="nav-ico">🔖</span><span>景點</span></button>
    </nav>
  </main>

  <div class="dialog-bg" id="dialogBg" onclick="closeDialog(event)"><section class="dialog" onclick="event.stopPropagation()"><h3 id="dialogTitle">新增資料</h3><form class="form" id="dialogForm"></form></section></div>

  <script>
    const storageKey = "busan-travel-planner-v3";
    const weekdays = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
    const categories = ["全部","景點","美食","購物","住宿","代買物聘"];
    const defaultRates = {"₩":0.0213,"NT$":1,"¥":0.214,"$":32.3,"€":35.1,"£":41.2,"HK$":4.13,"S$":24.1,"฿":0.89,"A$":21.2,"C$":23.6};
    const currencyList = ["₩","NT$","¥","$","€","£","HK$","S$","฿","A$","C$"];

    function id(){return "id" + Math.random().toString(16).slice(2) + Date.now()}

    const demo = {
      title:"Busan 遊記", subtitle:"Buson．釜山之旅", currency:"₩", themeColor:"#f6efd9", rates:defaultRates, activeDate:"", placeFilter:"",
      days:["2026-07-06","2026-07-07","2026-07-08","2026-07-09","2026-07-10","2026-07-11"],
      todos:[
        {id:id(),text:"確認護照、機票與住宿資料",done:false},
        {id:id(),text:"購買韓國網卡或 eSIM",done:false},
        {id:id(),text:"下載離線地圖與交通 App",done:true}
      ]
    };

    let state = load();
    function load(){try{const saved=localStorage.getItem(storageKey);return saved?JSON.parse(saved):structuredClone(demo)}catch(e){return structuredClone(demo)}}
    function save(){localStorage.setItem(storageKey,JSON.stringify(state))}
    function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
    function byTime(a,b){return String(a.time||a.departTime||"").localeCompare(String(b.time||b.departTime||""))}
    function dateInfo(s){const d=new Date(s+"T00:00:00");return {w:weekdays[d.getDay()],d:String(d.getDate()).padStart(2,"0"),m:String(d.getMonth()+1).padStart(2,"0")+"月"}}
    function twd(amount,currency){const rate=Number((state.rates||defaultRates)[currency]??1);return Number(amount||0)*rate}
    function money(amount,currency){return `${currency||state.currency}${Number(amount||0).toLocaleString("zh-Hant",{maximumFractionDigits:2})}`}
    function mapsSearch(q){return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`}
    function mode(m){return {"開車":"driving","步行":"walking","大眾運輸":"transit","地鐵":"transit","公車":"transit","自行車":"bicycling"}[m]||"transit"}
    function mapsRoute(r){return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(r.from)}&destination=${encodeURIComponent(r.to)}&travelmode=${mode(r.mode)}`}

    function render(){
      document.documentElement.style.setProperty("--bg",state.themeColor||"#f6efd9");
      document.body.style.background=`linear-gradient(180deg,${state.themeColor||"#f6efd9"},#efe3c6)`;
      document.getElementById("tripTitle").textContent=state.title;
      document.getElementById("tripSubtitle").textContent=state.subtitle||"Buson．釜山之旅";
      renderDates();renderHome();renderSchedule();renderMap();renderExpenses();renderPlaces();renderTodos();save();
    }
    function renderDates(){
      const el=document.getElementById("dateStrip");
      el.innerHTML=state.days.map(x=>{const l=dateInfo(x);return `<button class="date-card ${x===state.activeDate?"active":""}" onclick="setDate('${x}')"><span class="weekday">${l.w}</span><span class="day">${l.d}</span><span class="month">${l.m}</span></button>`}).join("");
      document.getElementById("dayText").textContent=`Day ${Math.max(0,state.days.indexOf(state.activeDate))+1} / ${state.days.length}`;
    }
    function setDate(d){state.activeDate=d;render()}
    function itemTpl(x,edit){return `<div class="timeline-item"><div class="time">${esc(x.time)}</div><div><div class="name">${esc(x.title)}</div><div class="meta">${esc(x.location||"未填地點")}・${esc(x.transport||"未填交通")}${x.note?"<br>"+esc(x.note):""}</div></div>${edit?`<div class="actions"><button class="tiny" onclick="openScheduleForm('${x.id}')">✎</button><button class="tiny danger" onclick="del('schedules','${x.id}')">×</button></div>`:""}</div>`}
    function renderHome(){const list=state.schedules.filter(x=>x.date===state.activeDate).sort(byTime).slice(0,3);document.getElementById("todayPreview").innerHTML=list.length?list.map(x=>itemTpl(x,false)).join(""):`<div class="empty">今天還沒有行程，點選「行程」新增。</div>`}
    function renderSchedule(){const list=state.schedules.filter(x=>x.date===state.activeDate).sort(byTime);document.getElementById("scheduleList").innerHTML=list.length?`<div class="timeline">${list.map(x=>itemTpl(x,true)).join("")}</div>`:`<div class="empty">尚無行程。按右上角「＋新增」建立活動。</div>`}
    function renderMap(){
      const routes=state.routes.filter(x=>x.date===state.activeDate).sort(byTime);
      const query=routes[0]?`${routes[0].from} to ${routes[0].to}`:(state.places[0]?.address||"Busan South Korea");
      document.getElementById("googleMapFrame").src=`https://www.google.com/maps?q=${encodeURIComponent(query)}&output=embed`;
      document.getElementById("routeList").innerHTML=routes.length?routes.map(r=>`<div class="route"><div class="two"><div><span class="badge">${esc(r.mode)}</span><div class="name" style="margin-top:8px">${esc(r.from)} → ${esc(r.to)}</div><div class="meta">${esc(r.departTime||"未填時間")}${r.note?"・"+esc(r.note):""}</div></div><div class="actions"><button class="tiny" onclick="openRouteForm('${r.id}')">✎</button><button class="tiny danger" onclick="del('routes','${r.id}')">×</button></div></div><button class="link" onclick="window.open('${mapsRoute(r)}','_blank')">開啟 Google Maps 路線 ›</button></div>`).join(""):`<div class="empty">尚無交通路線。可新增起點、終點與交通方式。</div>`;
      document.getElementById("mapPlaceList").innerHTML=state.places.length?state.places.slice(0,5).map(p=>`<div class="place"><span class="badge">${esc(p.category)}</span><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.city)}・${esc(p.address||"未填地址")}</div><button class="link" onclick="window.open('${mapsSearch(p.address||p.name)}','_blank')">在 Google Maps 查看 ›</button></div>`).join(""):`<div class="empty">還沒有收藏地點。</div>`;
    }
    function renderExpenses(){
      const today=state.expenses.filter(x=>x.date===state.activeDate);const daySum=today.reduce((s,x)=>s+twd(x.amount,x.currency),0);const allSum=state.expenses.reduce((s,x)=>s+twd(x.amount,x.currency),0);
      document.getElementById("todayTotal").textContent=`NT$${Math.round(daySum).toLocaleString("zh-Hant")}`;document.getElementById("tripTotal").textContent=`NT$${Math.round(allSum).toLocaleString("zh-Hant")}`;
      document.getElementById("expenseList").innerHTML=today.length?today.map(e=>`<div class="expense"><div class="two"><div><span class="badge">${esc(e.category)}</span><div class="name" style="margin-top:8px">${esc(e.item)}</div><div class="meta">付款：${esc(e.payer||"未填")}${e.note?"・"+esc(e.note):""}</div></div><div class="amount">${money(e.amount,e.currency)}<br><small style="font-family:inherit;color:var(--muted);font-size:12px">≈ NT$${Math.round(twd(e.amount,e.currency)).toLocaleString("zh-Hant")}</small></div></div><div class="actions"><button class="tiny" onclick="openExpenseForm('${e.id}')">✎</button><button class="tiny danger" onclick="del('expenses','${e.id}')">×</button></div></div>`).join(""):`<div class="empty">當日尚無支出紀錄。</div>`;
    }
    function renderPlaces(){
      document.getElementById("placeFilters").innerHTML=categories.map(c=>`<button class="pill ${state.placeFilter===c?"active":""}" onclick="setPlaceFilter('${c}')">${c}</button>`).join("");
      const list=state.placeFilter==="全部"?state.places:state.places.filter(x=>x.category===state.placeFilter);
      document.getElementById("placeList").innerHTML=list.length?list.map(p=>`<div class="place"><div class="two"><div><span class="badge">${esc(p.category)}</span><div class="name" style="margin-top:8px">${esc(p.name)}</div><div class="meta">${esc(p.city||"未填城市")}・${esc(p.address||"未填地址")}</div>${p.note?`<div class="meta">${esc(p.note)}</div>`:""}</div><div class="actions"><button class="tiny" onclick="openPlaceForm('${p.id}')">✎</button><button class="tiny danger" onclick="del('places','${p.id}')">×</button></div></div><button class="link" onclick="window.open('${mapsSearch(p.address||p.name)}','_blank')">在 Google Maps 查看 ›</button></div>`).join(""):`<div class="empty">目前沒有「${esc(state.placeFilter)}」資料。</div>`;
    }

    function renderTodos(){
      if(!Array.isArray(state.todos)) state.todos=[];
      const sorted=[...state.todos].sort((a,b)=>Number(a.done)-Number(b.done));
      const el=document.getElementById("todoList");
      if(!el) return;
      el.innerHTML=sorted.length?sorted.map(t=>`<div class="place"><div class="two"><label style="display:flex;grid-template-columns:auto 1fr;align-items:center;gap:10px;color:var(--ink);font-size:15px"><input type="checkbox" ${t.done?"checked":""} onchange="toggleTodo('${t.id}')" style="width:18px;height:18px;accent-color:var(--main)"><span style="${t.done?"text-decoration:line-through;color:var(--muted)":""}">${esc(t.text)}</span></label><div class="actions"><button class="tiny" onclick="openTodoForm('${t.id}')">✎</button><button class="tiny danger" onclick="del('todos','${t.id}')">×</button></div></div></div>`).join(""):`<div class="empty">尚無代買物品。代辦內容不會跟日期變動，完成後會自動移到最後。</div>`;
    }

    function toggleTodo(itemId){
      state.todos=state.todos.map(t=>t.id===itemId?{...t,done:!t.done}:t);
      render();
    }
    function setPlaceFilter(c){state.placeFilter=c;render()}
    function setTab(tab){document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));document.getElementById("page-"+tab).classList.add("active");document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));window.scrollTo({top:0,behavior:"smooth"})}

    function openDialog(title,fields,submit){const bg=document.getElementById("dialogBg"),form=document.getElementById("dialogForm");document.getElementById("dialogTitle").textContent=title;form.innerHTML=fields.join("")+`<div class="dialog-actions"><button type="button" class="secondary" onclick="closeDialog()">取消</button><button class="primary" type="submit">儲存</button></div>`;form.onsubmit=e=>{e.preventDefault();submit(Object.fromEntries(new FormData(form).entries()));closeDialog();render()};bg.classList.add("open")}
    function closeDialog(e){if(e&&e.target.id!=="dialogBg")return;document.getElementById("dialogBg").classList.remove("open")}
    function input(label,name,value,type="text"){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" required></label>`}
    function optInput(label,name,value,type="text"){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}"></label>`}
    function area(label,name,value){return `<label>${label}<textarea name="${name}">${esc(value)}</textarea></label>`}
    function select(label,name,opts,value){return `<label>${label}<select name="${name}">${opts.map(o=>`<option value="${esc(o)}" ${o===value?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`}
    function dateSelect(value){return select("日期","date",state.days,value||state.activeDate)}
    function ratesText(){return currencyList.map(c=>`${c}=${(state.rates||defaultRates)[c]??1}`).join(String.fromCharCode(10))}
    function parseRates(text){const out={...(state.rates||defaultRates)};String(text||"").split(String.fromCharCode(10)).forEach(line=>{const parts=line.split("=");const k=(parts[0]||"").trim();const v=Number((parts[1]||"").trim());if(k&&!Number.isNaN(v))out[k]=v});return out}

    function openSettings(){openDialog("旅程設定",[input("旅程標題","title",state.title),input("副標題","subtitle",state.subtitle||"Buson．釜山之旅"),select("主要貨幣","currency",currencyList,state.currency),area("日期清單：每行一個 YYYY-MM-DD","days",state.days.join(String.fromCharCode(10))),area("匯率設定：每 1 單位外幣可換多少台幣，例如 ₩=0.0213","rates",ratesText()),`<label>背景顏色<input name="themeColor" type="color" value="${esc(state.themeColor||"#f6efd9")}"></label>`],data=>{state.title=data.title;state.subtitle=data.subtitle;state.currency=data.currency;state.themeColor=data.themeColor||"#f6efd9";state.rates=parseRates(data.rates);const days=String(data.days||"").split(String.fromCharCode(10)).map(x=>x.trim()).filter(Boolean);if(days.length)state.days=days;if(!state.days.includes(state.activeDate))state.activeDate=state.days[0]})}
    function openScheduleForm(itemId){const x=state.schedules.find(a=>a.id===itemId)||{date:state.activeDate,time:"09:00",title:"",location:"",transport:"步行",note:""};openDialog(itemId?"編輯行程":"新增行程",[`<div class="row">${dateSelect(x.date)}${input("時間","time",x.time,"time")}</div>`,input("活動名稱","title",x.title),optInput("地點","location",x.location),select("交通方式","transport",["步行","大眾運輸","地鐵","公車","火車","開車","自行車","飛機","其他"],x.transport),area("備註","note",x.note)],data=>upsert("schedules",itemId,data))}
    function openRouteForm(itemId){const x=state.routes.find(a=>a.id===itemId)||{date:state.activeDate,from:"",to:"",mode:"大眾運輸",departTime:"09:00",note:""};openDialog(itemId?"編輯交通路線":"新增交通路線",[`<div class="row">${dateSelect(x.date)}${input("出發時間","departTime",x.departTime,"time")}</div>`,input("起點","from",x.from),input("終點","to",x.to),select("交通方式","mode",["大眾運輸","地鐵","公車","步行","開車","自行車","火車","飛機","其他"],x.mode),area("備註","note",x.note)],data=>upsert("routes",itemId,data))}
    function openExpenseForm(itemId){const x=state.expenses.find(a=>a.id===itemId)||{date:state.activeDate,item:"",category:"餐費",amount:"",currency:state.currency,payer:"我",note:""};openDialog(itemId?"編輯支出":"新增支出",[`<div class="row">${dateSelect(x.date)}${input("金額","amount",x.amount,"number")}</div>`,input("項目","item",x.item),select("幣別","currency",currencyList,x.currency||state.currency),select("分類","category",["餐費","交通","住宿","門票","購物","代買清單"],x.category),optInput("付款人","payer",x.payer),area("備註","note",x.note)],data=>{data.amount=Number(data.amount||0);upsert("expenses",itemId,data)})}
    function openPlaceForm(itemId){const x=state.places.find(a=>a.id===itemId)||{name:"",category:"景點",city:"",address:"",note:""};openDialog(itemId?"編輯景點 / 美食":"新增景點 / 美食",[input("名稱","name",x.name),select("分類","category",["景點","美食","購物","住宿","其他"],x.category),optInput("城市","city",x.city),optInput("地址 / Google Maps 搜尋字","address",x.address),area("備註","note",x.note)],data=>upsert("places",itemId,data))}
    function openTodoForm(itemId){const x=(state.todos||[]).find(a=>a.id===itemId)||{text:"",done:false};openDialog(itemId?"編輯代買品項":"新增代買品項",[input("代買物品","text",x.text),select("狀態","done",["未完成","已完成"],x.done?"已完成":"未完成")],data=>{data.done=data.done==="已完成";upsert("todos",itemId,data)})}
    function upsert(col,itemId,data){if(itemId){state[col]=state[col].map(x=>x.id===itemId?{...x,...data}:x)}else{state[col].push({id:id(),...data})}}
    function del(col,itemId){if(confirm("確定要刪除這筆資料嗎？")){state[col]=state[col].filter(x=>x.id!==itemId);render()}}

    render();
  </script>
</body>
</html>
